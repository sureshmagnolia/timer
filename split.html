<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditorium Timer - Dual Screen AV Simulator</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@600;800;900&family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      background: #030712;
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      height: 100vh;
      display: flex;
      flex-direction: column;
      overflow: hidden;
    }
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 10px 20px;
      background: #0b0f19;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      z-index: 10;
    }
    .top-title {
      font-size: 14px;
      font-weight: 700;
      letter-spacing: 0.05em;
      color: #38bdf8;
      display: flex;
      align-items: center;
      gap: 10px;
    }
    .split-nav-links {
      display: flex;
      gap: 12px;
    }
    .nav-btn {
      background: rgba(255, 255, 255, 0.08);
      border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1;
      padding: 6px 14px;
      border-radius: 8px;
      font-size: 12px;
      font-weight: 600;
      text-decoration: none;
      cursor: pointer;
      transition: all 0.2s;
    }
    .nav-btn:hover {
      background: #0284c7;
      color: #ffffff;
      border-color: #38bdf8;
    }
    .split-container {
      flex: 1;
      display: grid;
      grid-template-columns: 50% 50%;
      height: calc(100vh - 49px);
    }
    .pane {
      position: relative;
      height: 100%;
      border-right: 1px solid rgba(255, 255, 255, 0.15);
    }
    .pane:last-child {
      border-right: none;
    }
    .pane-header {
      position: absolute;
      top: 10px;
      left: 14px;
      background: rgba(15, 23, 42, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.2);
      padding: 4px 12px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.06em;
      color: #94a3b8;
      text-transform: uppercase;
      z-index: 5;
      backdrop-filter: blur(8px);
      pointer-events: none;
    }
    iframe {
      width: 100%;
      height: 100%;
      border: none;
    }
  </style>
</head>
<body>
  <div class="top-bar">
    <div class="top-title">
      <span>🎛️ DUAL SCREEN LIVE SIMULATOR</span>
      <span style="color: #64748b; font-size: 12px; font-weight: 400;">| Test Operator Controls and Auditorium Display side-by-side</span>
    </div>
    <div class="split-nav-links">
      <a href="index.html" class="nav-btn">🖥️ Operator Console Only</a>
      <a href="display.html" class="nav-btn" target="_blank">📽️ Stage Display Only</a>
      <button class="nav-btn" style="background:#0284c7; color:#fff;" onclick="window.open('display.html', 'StageDisplay', 'width=1920,height=1080')">🚀 Popout Stage Display</button>
    </div>
  </div>

  <div class="split-container">
    <div class="pane">
      <div class="pane-header">SCREEN 1: AV OPERATOR CONSOLE</div>
      <iframe src="index.html" allow="fullscreen" allowfullscreen></iframe>
    </div>
    <div class="pane">
      <div class="pane-header">SCREEN 2: AUDITORIUM PROJECTOR / LED DISPLAY</div>
      <iframe src="display.html" allow="fullscreen" allowfullscreen></iframe>
    </div>
  </div>
</body>
</html>
